<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rr-sun-gradient" x1="16" y1="4" x2="16" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rr-ridge-gradient" x1="5" y1="11" x2="27" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="rr-pv-gradient" x1="8" y1="16" x2="24" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rr-bg-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#rr-bg-gradient)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="#334155" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Ambient Sun Glow -->
  <circle cx="16" cy="11.5" r="5" fill="#f59e0b" fill-opacity="0.18" />

  <!-- Radiant Solar Rays -->
  <line x1="16" y1="3" x2="16" y2="5.5" stroke="#fbbf24" stroke-width="1.75" stroke-linecap="round" />
  <line x1="9.5" y1="5.5" x2="11.2" y2="7.5" stroke="#fbbf24" stroke-width="1.75" stroke-linecap="round" />
  <line x1="22.5" y1="5.5" x2="20.8" y2="7.5" stroke="#fbbf24" stroke-width="1.75" stroke-linecap="round" />
  <line x1="4.8" y1="10.5" x2="7.2" y2="11.5" stroke="#fbbf24" stroke-width="1.75" stroke-linecap="round" />
  <line x1="27.2" y1="10.5" x2="24.8" y2="11.5" stroke="#fbbf24" stroke-width="1.75" stroke-linecap="round" />

  <!-- Rising Sun -->
  <circle cx="16" cy="11.5" r="4.25" fill="url(#rr-sun-gradient)" />

  <!-- Photovoltaic Solar Panel Array -->
  <polygon points="8,21 16,14 24,21 22.5,27 9.5,27" fill="#090d16" stroke="url(#rr-pv-gradient)" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Solar PV Grid Lines -->
  <line x1="16" y1="14.5" x2="16" y2="26.5" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.85" />
  <line x1="12" y1="23.5" x2="20" y2="23.5" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.75" />
  <line x1="10.5" y1="26.2" x2="21.5" y2="26.2" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />

  <!-- Rooftop Ridge & Gable -->
  <path d="M4.5 21L16 11L27.5 21" stroke="url(#rr-ridge-gradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
